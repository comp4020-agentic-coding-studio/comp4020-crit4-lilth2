<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Driftglass — a wind-chime instrument</title>
    <meta
      name="description"
      content="Move the mouse, touch the screen, or hold an arrow key: chimes ring wherever you pass, tuned so nothing you play can sound wrong."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Driftglass</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Driftglass</h1>
      <div
        id="stage"
        class="stage"
        tabindex="0"
        data-testid="stage"
        aria-label="Driftglass, a wind-chime instrument. Move the pointer, touch the screen, or hold an arrow key to make sound. Click, tap, or press space for a gust."
      >
        <canvas id="chimes"></canvas>
        <p id="invite" class="invite" data-testid="invite" aria-hidden="true">
          move &middot; touch &middot; arrow keys &middot; click for a gust
        </p>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
